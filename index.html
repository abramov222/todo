<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Список задач с поиском, темами и сохранением в браузере">
  <title>To-Do List</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('todo-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="dist/css/main.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1 class="header__title">Мои задачи</h1>
        <p class="header__subtitle js-summary">Задач нет</p>
      </div>
      <button type="button" class="theme-toggle js-theme-toggle" aria-pressed="false">
        <span class="visually-hidden">Тёмная тема</span>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <div class="toolbar">
        <div class="search">
          <label for="search" class="visually-hidden">Поиск задач</label>
          <svg class="search__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input id="search" class="search__input js-search" type="search" placeholder="Найти задачу..." autocomplete="off">
        </div>
        <button type="button" class="button button--primary js-add-task">
          <svg class="button__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Добавить задачу
        </button>
      </div>

      <section class="task-section" aria-labelledby="active-heading">
        <h2 class="task-section__title" id="active-heading" tabindex="-1">
          Активные <span class="task-section__count js-active-count">0</span>
        </h2>
        <ul class="task-section__list js-active-list"></ul>
        <p class="task-section__empty js-active-empty">Активных задач нет</p>
      </section>

      <section class="task-section" aria-labelledby="done-heading">
        <h2 class="task-section__title" id="done-heading" tabindex="-1">
          Выполненные <span class="task-section__count js-done-count">0</span>
        </h2>
        <ul class="task-section__list js-done-list"></ul>
        <p class="task-section__empty js-done-empty">Выполненных задач нет</p>
      </section>

      <p class="visually-hidden js-status" role="status" aria-live="polite"></p>
    </main>
  </div>

  <dialog class="modal js-task-dialog" aria-labelledby="task-dialog-title">
    <form class="modal__form js-task-form" method="dialog" novalidate>
      <h2 class="modal__title js-dialog-title" id="task-dialog-title">Новая задача</h2>
      <div class="form-field">
        <label class="form-field__label" for="task-title">Название</label>
        <input class="form-field__input js-task-input" id="task-title" name="title" type="text" maxlength="200" required autocomplete="off" aria-describedby="task-title-error">
        <p class="form-field__error js-task-error" id="task-title-error"></p>
      </div>
      <div class="modal__actions">
        <button type="button" class="button button--secondary js-close-dialog">Отмена</button>
        <button type="submit" class="button button--primary js-submit-task">Добавить</button>
      </div>
    </form>
  </dialog>

  <template id="task-template">
    <li class="task" data-task>
      <input class="task__checkbox" type="checkbox" data-role="done">
      <label class="task__title" data-role="title"></label>
      <div class="task__actions">
        <button type="button" class="icon-button" data-action="edit">
          <span class="visually-hidden">Редактировать задачу</span>
          <svg class="icon-button__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <button type="button" class="icon-button icon-button--danger" data-action="delete">
          <span class="visually-hidden">Удалить задачу</span>
          <svg class="icon-button__icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M3 6h18"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </li>
  </template>
</body>
</html>
